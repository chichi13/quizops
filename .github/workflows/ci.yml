name: CI

on:
  push:
  pull_request:

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.13"
      - run: uv sync
      - run: uvx ruff format --check .
      - run: uvx ruff check .
      - run: uv run pytest -q
